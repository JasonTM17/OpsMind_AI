packages:
  - apps/*

overrides:
  postcss: 8.5.18
  'brace-expansion@5.0.7': 5.0.8
  sharp: 0.35.3

allowBuilds:
  'sharp@0.35.3': true
  'unrs-resolver@1.12.2': true

strictDepBuilds: true
verifyDepsBeforeRun: error
enableGlobalVirtualStore: false
nodeVersion: 24.12.0
engineStrict: true
patchedDependencies:
  brace-expansion@1.1.16: patches/brace-expansion@1.1.16.patch

auditConfig:
  # GHSA-mh99-v99m-4gvg has no compatible 1.x release. The local patch
  # backports the 5.0.8 length bound and is enforced by the CI probe.
  # Owner: platform-security. Review by 2026-08-09 and remove when the
  # ESLint/Next.js dependency graph no longer resolves brace-expansion 1.x.
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
