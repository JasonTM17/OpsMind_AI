spring:
  application:
    name: opsmind-platform-api
  aop:
    proxy-target-class: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # Persistence is opt-in for the health-only bootstrap. The persistence
  # profile removes this exclusion after DATABASE_URL and least-privilege
  # credentials are provisioned by the deployment layer.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.health.DataSourceHealthContributorAutoConfiguration

server:
  port: ${PLATFORM_API_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  server:
    port: ${PLATFORM_MANAGEMENT_PORT:8082}
  endpoints:
    web:
      exposure:
        include: ${OPSMIND_MANAGEMENT_EXPOSED_ENDPOINTS:health}
  health:
    db:
      enabled: false
  endpoint:
    health:
      show-details: never

opsmind:
  ai-runtime:
    client:
      enabled: ${OPSMIND_AI_RUNTIME_CLIENT_ENABLED:false}
      endpoint: ${OPSMIND_AI_RUNTIME_ENDPOINT:https://ai-runtime.invalid.example/api/v1/analysis}
      allow-local-cleartext: ${OPSMIND_AI_RUNTIME_ALLOW_LOCAL_CLEARTEXT:false}
      connect-timeout: ${OPSMIND_AI_RUNTIME_CONNECT_TIMEOUT:PT2S}
      request-timeout: ${OPSMIND_AI_RUNTIME_REQUEST_TIMEOUT:PT30S}
      max-response-body-bytes: ${OPSMIND_AI_RUNTIME_MAX_RESPONSE_BODY_BYTES:1048576}
    capability:
      enabled: ${OPSMIND_AI_CAPABILITY_ISSUANCE_ENABLED:false}
      issuer: ${OPSMIND_AI_CAPABILITY_ISSUER:https://platform.invalid.example}
      audience: ${OPSMIND_AI_CAPABILITY_AUDIENCE:opsmind-ai-runtime}
      key-id: ${OPSMIND_AI_CAPABILITY_KEY_ID:}
      private-key-path: ${OPSMIND_AI_CAPABILITY_PRIVATE_KEY_FILE:}
      maximum-lifetime: ${OPSMIND_AI_CAPABILITY_MAX_LIFETIME:PT4M}
  evidence:
    artifact:
      storage:
        # This boundary is deliberately off until an approved S3-compatible
        # backend, external workload credentials, and KMS references exist.
        enabled: ${OPSMIND_EVIDENCE_ARTIFACT_STORAGE_ENABLED:false}
        endpoint: ${OPSMIND_EVIDENCE_ARTIFACT_STORAGE_ENDPOINT:https://s3.invalid.example}
        allow-loopback-cleartext: ${OPSMIND_EVIDENCE_ARTIFACT_STORAGE_ALLOW_LOOPBACK_CLEARTEXT:false}
        region: ${OPSMIND_EVIDENCE_ARTIFACT_STORAGE_REGION:disabled}
        bucket: ${OPSMIND_EVIDENCE_ARTIFACT_STORAGE_BUCKET:disabled}
        path-style-access: ${OPSMIND_EVIDENCE_ARTIFACT_STORAGE_PATH_STYLE_ACCESS:false}
        expected-bucket-owner: ${OPSMIND_EVIDENCE_ARTIFACT_STORAGE_EXPECTED_BUCKET_OWNER:}
        kms-key-id: ${OPSMIND_EVIDENCE_ARTIFACT_STORAGE_KMS_KEY_ID:}
        encryption-profile: ${OPSMIND_EVIDENCE_ARTIFACT_STORAGE_ENCRYPTION_PROFILE:production-kms}
        maximum-object-bytes: ${OPSMIND_EVIDENCE_ARTIFACT_STORAGE_MAXIMUM_OBJECT_BYTES:0}
        connect-timeout: ${OPSMIND_EVIDENCE_ARTIFACT_STORAGE_CONNECT_TIMEOUT:PT2S}
        socket-timeout: ${OPSMIND_EVIDENCE_ARTIFACT_STORAGE_SOCKET_TIMEOUT:PT30S}
        api-call-attempt-timeout: ${OPSMIND_EVIDENCE_ARTIFACT_STORAGE_API_CALL_ATTEMPT_TIMEOUT:PT30S}
        api-call-timeout: ${OPSMIND_EVIDENCE_ARTIFACT_STORAGE_API_CALL_TIMEOUT:PT35S}
        maximum-connections: ${OPSMIND_EVIDENCE_ARTIFACT_STORAGE_MAXIMUM_CONNECTIONS:8}
        upload-lease-duration: ${OPSMIND_EVIDENCE_ARTIFACT_STORAGE_UPLOAD_LEASE_DURATION:PT1M}
  http:
    max-json-body-bytes: ${OPSMIND_MAX_JSON_BODY_BYTES:65536}
  dispatcher:
    enabled: ${OPSMIND_DISPATCHER_ENABLED:false}
    datasource:
      url: ${OPSMIND_DISPATCHER_DB_URL:disabled}
      username: ${OPSMIND_DISPATCHER_DB_USERNAME:disabled}
      password: ${OPSMIND_DISPATCHER_DB_PASSWORD:}
      maximum-pool-size: ${OPSMIND_DISPATCHER_DB_POOL_MAX:4}
      connection-timeout-ms: ${OPSMIND_DISPATCHER_DB_CONNECTION_TIMEOUT_MS:3000}
  workflow-reconciler:
    enabled: ${OPSMIND_WORKFLOW_RECONCILER_ENABLED:false}
    datasource:
      url: ${OPSMIND_WORKFLOW_RECONCILER_DB_URL:disabled}
      username: ${OPSMIND_WORKFLOW_RECONCILER_DB_USERNAME:disabled}
      password: ${OPSMIND_WORKFLOW_RECONCILER_DB_PASSWORD:}
      maximum-pool-size: ${OPSMIND_WORKFLOW_RECONCILER_DB_POOL_MAX:2}
      connection-timeout-ms: ${OPSMIND_WORKFLOW_RECONCILER_DB_CONNECTION_TIMEOUT_MS:3000}
      query-timeout-seconds: ${OPSMIND_WORKFLOW_RECONCILER_DB_QUERY_TIMEOUT_SECONDS:1}
  investigation:
    enabled: ${OPSMIND_INVESTIGATION_V1_ENABLED:false}
    fixture: ${OPSMIND_INVESTIGATION_FIXTURE:false}
    store: ${OPSMIND_INVESTIGATION_STORE:postgres}
    execution-mode: ${OPSMIND_INVESTIGATION_EXECUTION_MODE:inline}
    workflow:
      cluster-id: ${OPSMIND_INVESTIGATION_TEMPORAL_CLUSTER_ID:disabled}
      namespace: ${OPSMIND_INVESTIGATION_TEMPORAL_NAMESPACE:disabled}
      workflow-type: ${OPSMIND_INVESTIGATION_TEMPORAL_WORKFLOW_TYPE:opsmind-investigation-v1}
      task-queue: ${OPSMIND_INVESTIGATION_TEMPORAL_TASK_QUEUE:disabled}
    temporal-client:
      enabled: ${OPSMIND_INVESTIGATION_TEMPORAL_CLIENT_ENABLED:false}
      cluster-id: ${OPSMIND_INVESTIGATION_TEMPORAL_CLUSTER_ID:disabled}
      target: ${OPSMIND_INVESTIGATION_TEMPORAL_TARGET:disabled}
      tls-enabled: ${OPSMIND_INVESTIGATION_TEMPORAL_TLS_ENABLED:true}
      allow-local-cleartext: ${OPSMIND_INVESTIGATION_TEMPORAL_ALLOW_LOCAL_CLEARTEXT:false}
      rpc-timeout: ${OPSMIND_INVESTIGATION_TEMPORAL_RPC_TIMEOUT:PT5S}
      required-worker-identity: ${OPSMIND_INVESTIGATION_TEMPORAL_WORKER_IDENTITY:disabled}
      required-worker-build-id: ${OPSMIND_INVESTIGATION_TEMPORAL_WORKER_BUILD_ID:disabled}
    temporal-observer:
      enabled: ${OPSMIND_INVESTIGATION_TEMPORAL_OBSERVER_ENABLED:false}
      cluster-id: ${OPSMIND_INVESTIGATION_TEMPORAL_CLUSTER_ID:disabled}
      target: ${OPSMIND_INVESTIGATION_TEMPORAL_OBSERVER_TARGET:disabled}
      tls-enabled: ${OPSMIND_INVESTIGATION_TEMPORAL_OBSERVER_TLS_ENABLED:true}
      allow-local-cleartext: ${OPSMIND_INVESTIGATION_TEMPORAL_OBSERVER_ALLOW_LOCAL_CLEARTEXT:false}
      rpc-timeout: ${OPSMIND_INVESTIGATION_TEMPORAL_OBSERVER_RPC_TIMEOUT:PT5S}
      api-key: ${OPSMIND_INVESTIGATION_TEMPORAL_OBSERVER_API_KEY:}
    workflow-reconciler:
      enabled: ${OPSMIND_WORKFLOW_RECONCILER_ENABLED:false}
      poll-interval: ${OPSMIND_WORKFLOW_RECONCILER_POLL_INTERVAL:PT1S}
      lease-duration: ${OPSMIND_WORKFLOW_RECONCILER_LEASE_DURATION:PT30S}
      settlement-margin: ${OPSMIND_WORKFLOW_RECONCILER_SETTLEMENT_MARGIN:PT5S}
      maximum-attempts: ${OPSMIND_WORKFLOW_RECONCILER_MAX_ATTEMPTS:8}
      maximum-age: ${OPSMIND_WORKFLOW_RECONCILER_MAX_AGE:PT1H}
      maximum-handoff-age: ${OPSMIND_WORKFLOW_RECONCILER_MAX_HANDOFF_AGE:PT1H}
      initial-backoff: ${OPSMIND_WORKFLOW_RECONCILER_INITIAL_BACKOFF:PT1S}
      maximum-backoff: ${OPSMIND_WORKFLOW_RECONCILER_MAX_BACKOFF:PT1M}
      absence-confirmation-delay: ${OPSMIND_WORKFLOW_RECONCILER_ABSENCE_CONFIRMATION_DELAY:PT10S}
      namespace-retention: ${OPSMIND_WORKFLOW_RECONCILER_NAMESPACE_RETENTION:P30D}
      retention-safety-margin: ${OPSMIND_WORKFLOW_RECONCILER_RETENTION_SAFETY_MARGIN:P1D}
    workflow-starter:
      enabled: ${OPSMIND_INVESTIGATION_WORKFLOW_STARTER_ENABLED:false}
      poll-interval: ${OPSMIND_INVESTIGATION_WORKFLOW_STARTER_POLL_INTERVAL:PT1S}
      lease-duration: ${OPSMIND_INVESTIGATION_WORKFLOW_STARTER_LEASE_DURATION:PT30S}
      rpc-safety-margin: ${OPSMIND_INVESTIGATION_WORKFLOW_STARTER_RPC_MARGIN:PT5S}
      maximum-age: ${OPSMIND_INVESTIGATION_WORKFLOW_STARTER_MAX_AGE:PT1H}
      initial-backoff: ${OPSMIND_INVESTIGATION_WORKFLOW_STARTER_INITIAL_BACKOFF:PT1S}
      maximum-backoff: ${OPSMIND_INVESTIGATION_WORKFLOW_STARTER_MAX_BACKOFF:PT1M}
      maximum-attempts: ${OPSMIND_INVESTIGATION_WORKFLOW_STARTER_MAX_ATTEMPTS:8}
      tenant-limit: ${OPSMIND_INVESTIGATION_WORKFLOW_STARTER_TENANT_LIMIT:25}
      batch-size: ${OPSMIND_INVESTIGATION_WORKFLOW_STARTER_BATCH_SIZE:1}
  tool-gateway:
    client:
      enabled: ${OPSMIND_TOOL_GATEWAY_CLIENT_ENABLED:false}
      endpoint: ${OPSMIND_TOOL_GATEWAY_ENDPOINT:https://tool-gateway.invalid.example/internal/v1/tools/execute}
      allow-local-cleartext: ${OPSMIND_TOOL_GATEWAY_ALLOW_LOCAL_CLEARTEXT:false}
      connect-timeout: ${OPSMIND_TOOL_GATEWAY_CONNECT_TIMEOUT:PT2S}
      request-timeout: ${OPSMIND_TOOL_GATEWAY_REQUEST_TIMEOUT:PT10S}
      maximum-response-body-bytes: ${OPSMIND_TOOL_GATEWAY_MAX_RESPONSE_BODY_BYTES:131072}
    capability:
      enabled: ${OPSMIND_TOOL_CAPABILITY_ISSUANCE_ENABLED:false}
      issuer: ${OPSMIND_TOOL_CAPABILITY_ISSUER:https://platform.invalid.example}
      audience: ${OPSMIND_TOOL_CAPABILITY_AUDIENCE:opsmind-tool-gateway}
      authorized-party: ${OPSMIND_TOOL_CAPABILITY_AUTHORIZED_PARTY:opsmind-platform-api}
      key-id: ${OPSMIND_TOOL_CAPABILITY_KEY_ID:}
      private-key-path: ${OPSMIND_TOOL_CAPABILITY_PRIVATE_KEY_FILE:}
      maximum-lifetime: ${OPSMIND_TOOL_CAPABILITY_MAX_LIFETIME:PT2M}
    workload:
      enabled: ${OPSMIND_TOOL_WORKLOAD_AUTH_ENABLED:false}
      issuer: ${OPSMIND_TOOL_WORKLOAD_ISSUER:https://idp.invalid.example/opsmind}
      token-endpoint: ${OPSMIND_TOOL_WORKLOAD_TOKEN_ENDPOINT:https://idp.invalid.example/opsmind/oauth2/token}
      allow-local-cleartext: ${OPSMIND_TOOL_WORKLOAD_ALLOW_LOCAL_CLEARTEXT:false}
      audience: ${OPSMIND_TOOL_WORKLOAD_AUDIENCE:opsmind-tool-gateway-workload}
      client-id: ${OPSMIND_TOOL_WORKLOAD_CLIENT_ID:}
      client-secret: ${OPSMIND_TOOL_WORKLOAD_CLIENT_SECRET:}
      scope: ${OPSMIND_TOOL_WORKLOAD_SCOPE:tool.execute}
      connect-timeout: ${OPSMIND_TOOL_WORKLOAD_CONNECT_TIMEOUT:PT2S}
      request-timeout: ${OPSMIND_TOOL_WORKLOAD_REQUEST_TIMEOUT:PT5S}
      refresh-skew: ${OPSMIND_TOOL_WORKLOAD_REFRESH_SKEW:PT30S}
      maximum-token-lifetime: ${OPSMIND_TOOL_WORKLOAD_MAX_TOKEN_LIFETIME:PT5M}
      maximum-response-body-bytes: ${OPSMIND_TOOL_WORKLOAD_MAX_RESPONSE_BODY_BYTES:16384}
  security:
    mode: ${OPSMIND_SECURITY_MODE:fail-closed}
    audience: ${OIDC_AUDIENCE:opsmind-platform-api}
    issuer-uri: ${OIDC_ISSUER_URL:https://idp.invalid.example/opsmind}
    required-amr: ${OIDC_REQUIRED_AMR:mfa}
    maximum-token-lifetime: ${OIDC_MAX_TOKEN_LIFETIME:PT5M}
    clock-skew: ${OIDC_CLOCK_SKEW:PT60S}
    jwks-refresh-minimum-interval: ${OIDC_JWKS_REFRESH_MINIMUM_INTERVAL:PT1S}
