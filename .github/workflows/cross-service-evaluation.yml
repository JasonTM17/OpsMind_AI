name: Cross-service evaluation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-service-evaluation-${{ github.ref }}
  cancel-in-progress: true

env:
  OPS_ARTIFACT_ROOT: ${{ github.workspace }}/artifacts
  OPS_CACHE_ROOT: ${{ github.workspace }}/.opsmind/cache
  OPS_DATA_ROOT: ${{ github.workspace }}/.opsmind/data
  OPS_MODEL_ROOT: ${{ github.workspace }}/.opsmind/models
  OPS_MIN_C_FREE_GB: "5"
  OPS_MIN_D_FREE_GB: "5"
  OPS_MIN_WORKSPACE_FREE_GB: "5"

jobs:
  production-path:
    name: Phase 8B production-path A/B/C
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            services/ai-runtime/pyproject.toml
            services/ai-runtime/uv.lock
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - uses: ./.github/actions/install-pinned-maven
      - name: Preflight storage and toolchain
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/storage/check-capacity.sh
          sh scripts/storage/assert-storage-roots.sh --create-missing
          docker version
          pwsh --version
          openssl version
      - name: Build the exact executable inputs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv==0.11.29
          uv sync --project services/ai-runtime --locked
          mvn --batch-mode --no-transfer-progress \
            -Dmaven.repo.local="$OPS_CACHE_ROOT/maven" \
            -DskipTests -f services/platform-api/pom.xml package
          mvn --batch-mode --no-transfer-progress \
            -Dmaven.repo.local="$OPS_CACHE_ROOT/maven" \
            -DskipTests -f services/tool-gateway/pom.xml package
          test -s services/platform-api/target/platform-api.jar
          test -s services/tool-gateway/target/tool-gateway.jar
          test -x services/ai-runtime/.venv/bin/python
      - name: Attest source and executable inputs
        shell: bash
        run: |
          set -euo pipefail
          evidence="artifacts/verification/phase-08b/executable-attestation.txt"
          mkdir -p "$(dirname "$evidence")" .opsmind/reports
          {
            printf 'GitHead=%s\n' "$(git rev-parse HEAD)"
            printf 'GitTree=%s\n' "$(git status --porcelain=v1 --untracked-files=all | wc -l)"
            sha256sum \
              services/platform-api/target/platform-api.jar \
              services/tool-gateway/target/tool-gateway.jar \
              services/tool-gateway/src/main/resources/tool-manifests/observability-metrics-query-prometheus-v1.json \
              scripts/validation/cross-service/cross-service-evaluation-export.sql \
              evaluation/runner/project-cross-service-evaluation-export.mjs
            git ls-files -z services/ai-runtime \
              | sort -z \
              | xargs -0 sha256sum \
              | sha256sum \
              | sed 's/  -$/  services-ai-runtime-tracked-source/'
            printf 'Result=PASS\n'
          } | tee "$evidence"
          git diff --quiet
      - name: Validate static evaluation contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test evaluation/runner/*.test.mjs
          python scripts/validation/cross-service/test_fixture_provider.py
          pwsh -NoProfile -File \
            scripts/validation/cross-service/test-cross-service-path-safety.ps1
          node scripts/validation/validate-phase-08-evaluation-foundation.mjs
      - name: Execute and score fresh Scenario A/B/C
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="$OPS_ARTIFACT_ROOT/verification/phase-08b"
          report_root="$PWD/.opsmind/reports"
          overall=0
          for specification in A:100 B:1 C:1; do
            scenario="${specification%%:*}"
            warm_runs="${specification##*:}"
            lower="$(printf '%s' "$scenario" | tr '[:upper:]' '[:lower:]')"
            if [ "$scenario" = "A" ]; then
              report="$report_root/cross-service-trace.json"
            else
              report="$report_root/cross-service-trace.scenario-${lower}.json"
            fi
            result="$evidence_root/benchmark-result.scenario-${lower}.json"
            transcript="$evidence_root/cross-service.scenario-${lower}.txt"
            mkdir -p "$evidence_root" "$report_root"

            set +e
            pwsh -NoProfile -File \
              scripts/validation/cross-service/run-cross-service-verification.ps1 \
              -Scenario "$scenario" \
              -WarmRuns "$warm_runs" \
              -P95ThresholdMs 5000 \
              -ReportPath "$report" 2>&1 | tee "$transcript"
            harness_pipeline_status=("${PIPESTATUS[@]}")
            set -e
            harness_status="${harness_pipeline_status[0]:-1}"
            harness_transcript_status="${harness_pipeline_status[1]:-1}"
            if [ "$harness_status" -ne 0 ] || [ "$harness_transcript_status" -ne 0 ]; then
              if [ "$harness_transcript_status" -eq 0 ]; then
                if ! printf 'HarnessExit=%s\nHarnessTranscriptExit=%s\nResult=BLOCK\n' \
                  "$harness_status" "$harness_transcript_status" | tee -a "$transcript"; then
                  printf '%s\n' 'TranscriptAppend=BLOCK'
                fi
              else
                printf 'HarnessExit=%s\nHarnessTranscriptExit=%s\nResult=BLOCK\n' \
                  "$harness_status" "$harness_transcript_status"
              fi
              overall=1
              continue
            fi

            set +e
            OPSMIND_EVALUATION_TRACE_PATH="$report" \
            OPSMIND_EVALUATION_OUTPUT_PATH="$result" \
              node evaluation/runner/score-phase-07-trace.mjs 2>&1 | tee -a "$transcript"
            scorer_pipeline_status=("${PIPESTATUS[@]}")
            set -e
            scorer_status="${scorer_pipeline_status[0]:-1}"
            scorer_transcript_status="${scorer_pipeline_status[1]:-1}"
            if [ "$scorer_status" -ne 0 ] || [ "$scorer_transcript_status" -ne 0 ]; then
              overall=1
            fi
            result_status=PASS
            if [ "$scorer_status" -ne 0 ] || [ "$scorer_transcript_status" -ne 0 ]; then
              result_status=BLOCK
            fi
            if ! printf 'HarnessExit=%s\nHarnessTranscriptExit=%s\nScorerExit=%s\nScorerTranscriptExit=%s\nResult=%s\n' \
              "$harness_status" "$harness_transcript_status" \
              "$scorer_status" "$scorer_transcript_status" "$result_status" \
              | tee -a "$transcript"; then
              overall=1
            fi
          done
          exit "$overall"
      - name: Preserve the Phase 7 production-path contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validation/validate-phase-07-investigation-slice.mjs \
            | tee artifacts/verification/phase-08b/phase-07-regression.txt
      - name: Verify transient export cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if find .opsmind/cross-service -type f \
            \( -name 'evaluation-export-*.json' -o -name 'evaluation-enriched-trace.json' \) \
            -print -quit 2>/dev/null | grep -q .; then
            echo "Transient evaluation export survived cleanup." >&2
            exit 1
          fi
          printf '%s\n' 'TransientEvaluationExports=ABSENT'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: phase-08b-cross-service-evaluation
          path: |
            artifacts/verification/phase-08b/
            .opsmind/reports/cross-service-trace.json
            .opsmind/reports/cross-service-trace.scenario-*.json
          if-no-files-found: error
