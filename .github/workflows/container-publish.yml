name: Publish OCI packages

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Strict SemVer release, including the v prefix
        required: true
        type: string
      publish_dockerhub:
        description: Promote the verified GHCR digests to Docker Hub
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: container-publish
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact source revision
    if: >-
      github.repository == 'JasonTM17/OpsMind_AI' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.release.outputs.release_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release identity
        id: release
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          release_tag="$(node scripts/validation/strict-semver.mjs "$RELEASE_VERSION")"
          {
            echo "release_version=$RELEASE_VERSION"
            echo "release_tag=$release_tag"
            echo "source_sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Require successful exact-revision quality gates
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for workflow in pr-quality.yml cross-service-evaluation.yml; do
            endpoint="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs"
            response="$(curl --fail --silent --show-error \
              --get "$endpoint" \
              --data-urlencode "head_sha=$SOURCE_SHA" \
              --data-urlencode "status=completed" \
              --data-urlencode "per_page=30")"
            if ! jq -e \
              'any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")' \
              --arg sha "$SOURCE_SHA" <<<"$response" >/dev/null; then
              echo "::error::${workflow} has no successful run for ${SOURCE_SHA}."
              exit 1
            fi
          done

  build-candidate:
    name: Candidate ${{ matrix.component }}
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: Platform API
            image: opsmind-platform-api
            dockerfile: services/platform-api/Dockerfile
            port: 8080
            health_path: /actuator/health
          - component: AI Runtime
            image: opsmind-ai-runtime
            dockerfile: services/ai-runtime/Dockerfile
            port: 8000
            health_path: /ready
          - component: Tool Gateway
            image: opsmind-tool-gateway
            dockerfile: services/tool-gateway/Dockerfile
            port: 8081
            health_path: /actuator/health
          - component: Operator Web
            image: opsmind-operator-web
            dockerfile: apps/operator-web/Dockerfile
            port: 3000
            health_path: /api/health
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve immutable candidate target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          ghcr_owner="${GITHUB_REPOSITORY_OWNER,,}"
          ghcr_image="ghcr.io/${ghcr_owner}/${{ matrix.image }}"
          candidate_tag="candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "ghcr_image=$ghcr_image"
            echo "candidate_ref=${ghcr_image}:${candidate_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build immutable multi-architecture candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.target.outputs.candidate_ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=OpsMind AI
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.target.outputs.ghcr_image }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret,license
          vuln-type: os,library
          format: json
          output: trivy-${{ matrix.image }}.json
          exit-code: "0"

      - name: Verify manifest, labels, scan policy, and runtime health
        id: verify
        shell: bash
        env:
          CANDIDATE_REF: ${{ steps.target.outputs.candidate_ref }}
          GHCR_IMAGE: ${{ steps.target.outputs.ghcr_image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          EXPECTED_REVISION: ${{ github.sha }}
          TRIVY_REPORT: trivy-${{ matrix.image }}.json
          CONTAINER_PORT: ${{ matrix.port }}
          HEALTH_PATH: ${{ matrix.health_path }}
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect \
            "${GHCR_IMAGE}@${IMAGE_DIGEST}" --raw)"
          platforms="$(jq -c \
            '[.manifests[]
              | select(.platform.os != "unknown")
              | "\(.platform.os)/\(.platform.architecture)"]
             | unique | sort' <<<"$manifest")"
          if [[ "$platforms" != '["linux/amd64","linux/arm64"]' ]]; then
            echo "::error::Unexpected candidate platforms: ${platforms}"
            exit 1
          fi

          predicate_types='[]'
          while IFS= read -r attestation_digest; do
            attestation_manifest="$(docker buildx imagetools inspect \
              "${GHCR_IMAGE}@${attestation_digest}" --raw)"
            observed="$(jq -c \
              '[.layers[]?.annotations["in-toto.io/predicate-type"] // empty]' \
              <<<"$attestation_manifest")"
            predicate_types="$(jq -c -n \
              --argjson current "$predicate_types" \
              --argjson observed "$observed" \
              '$current + $observed | unique | sort')"
          done < <(jq -r \
            '.manifests[]
              | select(.platform.os == "unknown")
              | .digest' <<<"$manifest")

          if ! jq -e \
            'index("https://spdx.dev/Document") != null and
             any(.[]; startswith("https://slsa.dev/provenance/"))' \
            <<<"$predicate_types" >/dev/null; then
            echo "::error::SBOM/provenance predicates missing: ${predicate_types}"
            exit 1
          fi

          docker pull "${GHCR_IMAGE}@${IMAGE_DIGEST}" >/dev/null
          source_label="$(docker image inspect "${GHCR_IMAGE}@${IMAGE_DIGEST}" \
            --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')"
          revision_label="$(docker image inspect "${GHCR_IMAGE}@${IMAGE_DIGEST}" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [[ "$source_label" != "$EXPECTED_SOURCE" ||
                "$revision_label" != "$EXPECTED_REVISION" ]]; then
            echo "::error::OCI source or revision label mismatch."
            exit 1
          fi

          high_critical="$(jq \
            '[.Results[]?.Vulnerabilities[]?
              | select(.Severity == "HIGH" or .Severity == "CRITICAL")]
             | length' "$TRIVY_REPORT")"
          secrets="$(jq \
            '[.Results[]?.Secrets[]?] | length' "$TRIVY_REPORT")"
          licenses="$(jq \
            '[.Results[]?.Licenses[]?] | length' "$TRIVY_REPORT")"
          if (( high_critical > 0 || secrets > 0 )); then
            echo "::error::Candidate scan found ${high_critical} HIGH/CRITICAL vulnerabilities and ${secrets} secrets."
            exit 1
          fi

          container_name="opsmind-smoke-${{ matrix.image }}"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach \
            --name "$container_name" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:size=64m,mode=1777 \
            --tmpfs /app/apps/operator-web/.next/cache:size=64m,uid=1000,gid=1000,mode=0700 \
            --publish "127.0.0.1:18080:${CONTAINER_PORT}" \
            "${GHCR_IMAGE}@${IMAGE_DIGEST}" >/dev/null
          healthy=false
          for _ in {1..40}; do
            if curl --fail --silent \
              "http://127.0.0.1:18080${HEALTH_PATH}" >/dev/null; then
              healthy=true
              break
            fi
            sleep 3
          done
          if [[ "$healthy" != "true" ]]; then
            docker logs "$container_name"
            echo "::error::Candidate runtime health check failed."
            exit 1
          fi

          {
            echo "platforms=$platforms"
            echo "predicate_types=$predicate_types"
            echo "source_label=$source_label"
            echo "revision_label=$revision_label"
            echo "high_critical=$high_critical"
            echo "secrets=$secrets"
            echo "licenses=$licenses"
          } >> "$GITHUB_OUTPUT"

      - name: Generate signed candidate provenance
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.target.outputs.ghcr_image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify signed candidate and write observed receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ matrix.component }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          GHCR_IMAGE: ${{ steps.target.outputs.ghcr_image }}
          CANDIDATE_REF: ${{ steps.target.outputs.candidate_ref }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORMS: ${{ steps.verify.outputs.platforms }}
          PREDICATE_TYPES: ${{ steps.verify.outputs.predicate_types }}
          SOURCE_LABEL: ${{ steps.verify.outputs.source_label }}
          REVISION_LABEL: ${{ steps.verify.outputs.revision_label }}
          HIGH_CRITICAL: ${{ steps.verify.outputs.high_critical }}
          SECRETS_FOUND: ${{ steps.verify.outputs.secrets }}
          LICENSES_FOUND: ${{ steps.verify.outputs.licenses }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          gh attestation verify \
            "oci://${GHCR_IMAGE}@${IMAGE_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" >/dev/null

          receipt_root="artifacts/container-candidates/${{ matrix.image }}"
          mkdir -p "$receipt_root"
          jq -n \
            --arg schemaVersion "opsmind-oci-candidate-v2" \
            --arg component "$COMPONENT" \
            --arg image "${{ matrix.image }}" \
            --arg dockerfile "$DOCKERFILE" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg sourceRef "$GITHUB_REF" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg ghcrImage "$GHCR_IMAGE" \
            --arg candidateRef "$CANDIDATE_REF" \
            --arg digest "$IMAGE_DIGEST" \
            --arg attestationUrl "$ATTESTATION_URL" \
            --argjson platforms "$PLATFORMS" \
            --argjson predicateTypes "$PREDICATE_TYPES" \
            --arg sourceLabel "$SOURCE_LABEL" \
            --arg revisionLabel "$REVISION_LABEL" \
            --argjson highCritical "$HIGH_CRITICAL" \
            --argjson secretsFound "$SECRETS_FOUND" \
            --argjson licensesFound "$LICENSES_FOUND" \
            '{
              schemaVersion: $schemaVersion,
              component: $component,
              image: $image,
              dockerfile: $dockerfile,
              repository: $repository,
              sourceSha: $sourceSha,
              sourceRef: $sourceRef,
              workflow: {runId: $runId, runAttempt: $runAttempt},
              candidate: {
                ref: $candidateRef,
                image: $ghcrImage,
                digest: $digest
              },
              observed: {
                platforms: $platforms,
                predicateTypes: $predicateTypes,
                labels: {source: $sourceLabel, revision: $revisionLabel},
                scan: {
                  highCriticalVulnerabilities: $highCritical,
                  secrets: $secretsFound,
                  licensesInventoried: $licensesFound
                },
                runtimeHealth: "PASS",
                signedAttestation: {
                  verified: true,
                  url: $attestationUrl
                }
              },
              result: "PASS"
            }' > "$receipt_root/receipt.json"
          jq -e \
            '.result == "PASS" and
             .observed.scan.highCriticalVulnerabilities == 0 and
             .observed.scan.secrets == 0 and
             .observed.signedAttestation.verified == true' \
            "$receipt_root/receipt.json" >/dev/null

      - name: Upload candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-candidate-${{ matrix.image }}
          path: artifacts/container-candidates/${{ matrix.image }}
          if-no-files-found: error
          retention-days: 90

  promote:
    name: Approve and promote verified release set
    needs:
      - authorize
      - build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: oci-production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Preflight protected registry credentials
        id: registry
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PUBLISH_DOCKERHUB: ${{ inputs.publish_dockerhub }}
        run: |
          set -euo pipefail
          dockerhub_enabled=false
          dockerhub_namespace=
          if [[ "$PUBLISH_DOCKERHUB" == "true" ]]; then
            if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
              echo "::error::Docker Hub promotion requires protected environment credentials."
              exit 1
            fi
            if [[ ! "$DOCKERHUB_USERNAME" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,254}$ ]]; then
              echo "::error::DOCKERHUB_USERNAME has an invalid registry namespace shape."
              exit 1
            fi
            dockerhub_enabled=true
            dockerhub_namespace="${DOCKERHUB_USERNAME,,}"
          fi
          {
            echo "dockerhub_enabled=$dockerhub_enabled"
            echo "dockerhub_namespace=$dockerhub_namespace"
          } >> "$GITHUB_OUTPUT"

      - name: Download all candidate receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: oci-candidate-*
          path: artifacts/container-candidates
          merge-multiple: false

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.registry.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Verify aggregate candidate release set
        id: release_set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          mapfile -t receipts < <(find artifacts/container-candidates \
            -type f -name receipt.json -print | sort)
          if [[ "${#receipts[@]}" -ne 4 ]]; then
            echo "::error::Expected four candidate receipts; found ${#receipts[@]}."
            exit 1
          fi

          expected_images=(
            opsmind-platform-api
            opsmind-ai-runtime
            opsmind-tool-gateway
            opsmind-operator-web
          )
          for image in "${expected_images[@]}"; do
            receipt="$(jq -r --arg image "$image" \
              'select(.image == $image) | input_filename' "${receipts[@]}" \
              | head -n 1)"
            if [[ -z "$receipt" ]]; then
              echo "::error::Missing candidate receipt for ${image}."
              exit 1
            fi
            jq -e \
              '.schemaVersion == "opsmind-oci-candidate-v2" and
               .sourceSha == $sha and
               .result == "PASS" and
               .observed.platforms == ["linux/amd64", "linux/arm64"] and
               .observed.scan.highCriticalVulnerabilities == 0 and
               .observed.scan.secrets == 0 and
               .observed.runtimeHealth == "PASS" and
               .observed.signedAttestation.verified == true' \
              --arg sha "$EXPECTED_SHA" "$receipt" >/dev/null

            ghcr_image="$(jq -r '.candidate.image' "$receipt")"
            digest="$(jq -r '.candidate.digest' "$receipt")"
            observed_digest="$(docker buildx imagetools inspect \
              "${ghcr_image}@${digest}" | awk '/^Digest:/ {print $2; exit}')"
            if [[ "$observed_digest" != "$digest" ]]; then
              echo "::error::Candidate digest changed for ${image}."
              exit 1
            fi
            gh attestation verify \
              "oci://${ghcr_image}@${digest}" \
              --repo "$GITHUB_REPOSITORY" >/dev/null

            package_json="$(curl --fail --silent --show-error \
              "${GITHUB_API_URL}/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${image}")"
            jq -e \
              '.visibility == "public" and .repository.full_name == $repository' \
              --arg repository "$GITHUB_REPOSITORY" \
              <<<"$package_json" >/dev/null

            output_name="digest_${image//-/_}"
            echo "${output_name}=${digest}" >> "$GITHUB_OUTPUT"
          done

      - name: Promote immutable version and revision tags
        shell: bash
        env:
          DOCKERHUB_ENABLED: ${{ steps.registry.outputs.dockerhub_enabled }}
          DOCKERHUB_NAMESPACE: ${{ steps.registry.outputs.dockerhub_namespace }}
          RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          verify_tag() {
            local ref="$1"
            local expected="$2"
            local observed
            observed="$(docker buildx imagetools inspect "$ref" \
              | awk '/^Digest:/ {print $2; exit}')"
            [[ "$observed" == "$expected" ]] || {
              echo "::error::Digest parity failed for ${ref}."
              exit 1
            }
          }
          promote_immutable() {
            local source="$1"
            local expected="$2"
            shift 2
            local targets=("$@")
            local create_args=()
            for target in "${targets[@]}"; do
              if docker buildx imagetools inspect "$target" >/dev/null 2>&1; then
                verify_tag "$target" "$expected"
              else
                create_args+=(--tag "$target")
              fi
            done
            if (( ${#create_args[@]} > 0 )); then
              docker buildx imagetools create "${create_args[@]}" "$source"
            fi
            for target in "${targets[@]}"; do
              verify_tag "$target" "$expected"
            done
          }

          mapfile -t receipts < <(find artifacts/container-candidates \
            -type f -name receipt.json -print | sort)
          for receipt in "${receipts[@]}"; do
            image="$(jq -r '.image' "$receipt")"
            ghcr_image="$(jq -r '.candidate.image' "$receipt")"
            digest="$(jq -r '.candidate.digest' "$receipt")"
            promote_immutable \
              "${ghcr_image}@${digest}" \
              "$digest" \
              "${ghcr_image}:${RELEASE_TAG}" \
              "${ghcr_image}:sha-${SOURCE_SHA}"

            if [[ "$DOCKERHUB_ENABLED" == "true" ]]; then
              dockerhub_image="docker.io/${DOCKERHUB_NAMESPACE}/${image}"
              promote_immutable \
                "${ghcr_image}@${digest}" \
                "$digest" \
                "${dockerhub_image}:${RELEASE_TAG}" \
                "${dockerhub_image}:sha-${SOURCE_SHA}"
            fi
          done

      - name: Sign Platform API on GHCR
        id: ghcr_platform_api
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ghcr.io/jasontm17/opsmind-platform-api
          subject-digest: ${{ steps.release_set.outputs.digest_opsmind_platform_api }}
          push-to-registry: true

      - name: Sign AI Runtime on GHCR
        id: ghcr_ai_runtime
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ghcr.io/jasontm17/opsmind-ai-runtime
          subject-digest: ${{ steps.release_set.outputs.digest_opsmind_ai_runtime }}
          push-to-registry: true

      - name: Sign Tool Gateway on GHCR
        id: ghcr_tool_gateway
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ghcr.io/jasontm17/opsmind-tool-gateway
          subject-digest: ${{ steps.release_set.outputs.digest_opsmind_tool_gateway }}
          push-to-registry: true

      - name: Sign Operator Web on GHCR
        id: ghcr_operator_web
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ghcr.io/jasontm17/opsmind-operator-web
          subject-digest: ${{ steps.release_set.outputs.digest_opsmind_operator_web }}
          push-to-registry: true

      - name: Sign Platform API on Docker Hub
        id: dockerhub_platform_api
        if: steps.registry.outputs.dockerhub_enabled == 'true'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: docker.io/${{ steps.registry.outputs.dockerhub_namespace }}/opsmind-platform-api
          subject-digest: ${{ steps.release_set.outputs.digest_opsmind_platform_api }}
          push-to-registry: true

      - name: Sign AI Runtime on Docker Hub
        id: dockerhub_ai_runtime
        if: steps.registry.outputs.dockerhub_enabled == 'true'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: docker.io/${{ steps.registry.outputs.dockerhub_namespace }}/opsmind-ai-runtime
          subject-digest: ${{ steps.release_set.outputs.digest_opsmind_ai_runtime }}
          push-to-registry: true

      - name: Sign Tool Gateway on Docker Hub
        id: dockerhub_tool_gateway
        if: steps.registry.outputs.dockerhub_enabled == 'true'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: docker.io/${{ steps.registry.outputs.dockerhub_namespace }}/opsmind-tool-gateway
          subject-digest: ${{ steps.release_set.outputs.digest_opsmind_tool_gateway }}
          push-to-registry: true

      - name: Sign Operator Web on Docker Hub
        id: dockerhub_operator_web
        if: steps.registry.outputs.dockerhub_enabled == 'true'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: docker.io/${{ steps.registry.outputs.dockerhub_namespace }}/opsmind-operator-web
          subject-digest: ${{ steps.release_set.outputs.digest_opsmind_operator_web }}
          push-to-registry: true

      - name: Verify signatures, activate latest, and write release-set receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_ENABLED: ${{ steps.registry.outputs.dockerhub_enabled }}
          DOCKERHUB_NAMESPACE: ${{ steps.registry.outputs.dockerhub_namespace }}
          RELEASE_VERSION: ${{ needs.authorize.outputs.release_version }}
          RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          GHCR_PLATFORM_API_ATTESTATION: ${{ steps.ghcr_platform_api.outputs.attestation-url }}
          GHCR_AI_RUNTIME_ATTESTATION: ${{ steps.ghcr_ai_runtime.outputs.attestation-url }}
          GHCR_TOOL_GATEWAY_ATTESTATION: ${{ steps.ghcr_tool_gateway.outputs.attestation-url }}
          GHCR_OPERATOR_WEB_ATTESTATION: ${{ steps.ghcr_operator_web.outputs.attestation-url }}
          DOCKERHUB_PLATFORM_API_ATTESTATION: ${{ steps.dockerhub_platform_api.outputs.attestation-url }}
          DOCKERHUB_AI_RUNTIME_ATTESTATION: ${{ steps.dockerhub_ai_runtime.outputs.attestation-url }}
          DOCKERHUB_TOOL_GATEWAY_ATTESTATION: ${{ steps.dockerhub_tool_gateway.outputs.attestation-url }}
          DOCKERHUB_OPERATOR_WEB_ATTESTATION: ${{ steps.dockerhub_operator_web.outputs.attestation-url }}
        run: |
          set -euo pipefail
          verify_tag() {
            local ref="$1"
            local expected="$2"
            local observed
            observed="$(docker buildx imagetools inspect "$ref" \
              | awk '/^Digest:/ {print $2; exit}')"
            [[ "$observed" == "$expected" ]] || {
              echo "::error::Digest parity failed for ${ref}."
              exit 1
            }
          }
          mapfile -t receipts < <(find artifacts/container-candidates \
            -type f -name receipt.json -print | sort)
          for receipt in "${receipts[@]}"; do
            image="$(jq -r '.image' "$receipt")"
            ghcr_image="$(jq -r '.candidate.image' "$receipt")"
            digest="$(jq -r '.candidate.digest' "$receipt")"
            gh attestation verify \
              "oci://${ghcr_image}@${digest}" \
              --repo "$GITHUB_REPOSITORY" >/dev/null
            if [[ "$DOCKERHUB_ENABLED" == "true" ]]; then
              dockerhub_image="docker.io/${DOCKERHUB_NAMESPACE}/${image}"
              gh attestation verify \
                "oci://${dockerhub_image}@${digest}" \
                --repo "$GITHUB_REPOSITORY" >/dev/null
            fi
          done

          for receipt in "${receipts[@]}"; do
            image="$(jq -r '.image' "$receipt")"
            ghcr_image="$(jq -r '.candidate.image' "$receipt")"
            digest="$(jq -r '.candidate.digest' "$receipt")"
            docker buildx imagetools create \
              --tag "${ghcr_image}:latest" "${ghcr_image}@${digest}"
            verify_tag "${ghcr_image}:latest" "$digest"
            if [[ "$DOCKERHUB_ENABLED" == "true" ]]; then
              dockerhub_image="docker.io/${DOCKERHUB_NAMESPACE}/${image}"
              docker buildx imagetools create \
                --tag "${dockerhub_image}:latest" \
                "${ghcr_image}@${digest}"
              verify_tag "${dockerhub_image}:latest" "$digest"
            fi
          done

          receipt_root="artifacts/container-publication"
          mkdir -p "$receipt_root"
          jq -s \
            --arg schemaVersion "opsmind-oci-publication-v2" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg sourceRef "$GITHUB_REF" \
            --arg releaseVersion "$RELEASE_VERSION" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg dockerHubNamespace "$DOCKERHUB_NAMESPACE" \
            --arg ghcrPlatformApiAttestation "$GHCR_PLATFORM_API_ATTESTATION" \
            --arg ghcrAiRuntimeAttestation "$GHCR_AI_RUNTIME_ATTESTATION" \
            --arg ghcrToolGatewayAttestation "$GHCR_TOOL_GATEWAY_ATTESTATION" \
            --arg ghcrOperatorWebAttestation "$GHCR_OPERATOR_WEB_ATTESTATION" \
            --arg dockerHubPlatformApiAttestation "$DOCKERHUB_PLATFORM_API_ATTESTATION" \
            --arg dockerHubAiRuntimeAttestation "$DOCKERHUB_AI_RUNTIME_ATTESTATION" \
            --arg dockerHubToolGatewayAttestation "$DOCKERHUB_TOOL_GATEWAY_ATTESTATION" \
            --arg dockerHubOperatorWebAttestation "$DOCKERHUB_OPERATOR_WEB_ATTESTATION" \
            --argjson dockerHubPublished "$DOCKERHUB_ENABLED" \
            'def ghcrAttestation:
               if .image == "opsmind-platform-api" then $ghcrPlatformApiAttestation
               elif .image == "opsmind-ai-runtime" then $ghcrAiRuntimeAttestation
               elif .image == "opsmind-tool-gateway" then $ghcrToolGatewayAttestation
               else $ghcrOperatorWebAttestation end;
             def dockerHubAttestation:
               if .image == "opsmind-platform-api" then $dockerHubPlatformApiAttestation
               elif .image == "opsmind-ai-runtime" then $dockerHubAiRuntimeAttestation
               elif .image == "opsmind-tool-gateway" then $dockerHubToolGatewayAttestation
               else $dockerHubOperatorWebAttestation end;
             {
              schemaVersion: $schemaVersion,
              repository: $repository,
              sourceSha: $sourceSha,
              sourceRef: $sourceRef,
              release: {version: $releaseVersion, tag: $releaseTag},
              workflow: {runId: $runId, runAttempt: $runAttempt},
              registries: {
                ghcr: {
                  published: true,
                  visibility: "public",
                  repositoryLinkageVerified: true
                },
                dockerHub: {
                  published: $dockerHubPublished,
                  namespace: $dockerHubNamespace
                }
              },
              components: map({
                image,
                digest: .candidate.digest,
                observed: .observed,
                registryAttestations: {
                  ghcr: {verified: true, url: ghcrAttestation},
                  dockerHub: {
                    published: $dockerHubPublished,
                    verified: $dockerHubPublished,
                    url: (if $dockerHubPublished then dockerHubAttestation else "" end)
                  }
                }
              }),
              activationTag: "latest",
              result: "PASS"
            }' "${receipts[@]}" > "$receipt_root/release-set.json"
          jq -e \
            '.result == "PASS" and
             (.components | length) == 4 and
             all(.components[];
               .observed.runtimeHealth == "PASS" and
               .observed.signedAttestation.verified == true and
               .registryAttestations.ghcr.verified == true and
               (.registryAttestations.ghcr.url | length) > 0 and
               (.registryAttestations.dockerHub.published == false or
                 ((.registryAttestations.dockerHub.verified == true) and
                  ((.registryAttestations.dockerHub.url | length) > 0))))' \
            "$receipt_root/release-set.json" >/dev/null

      - name: Upload immutable release-set evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-publication-release-set
          path: artifacts/container-publication/release-set.json
          if-no-files-found: error
          retention-days: 90
